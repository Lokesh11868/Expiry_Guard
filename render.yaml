services:
  # Python FastAPI Backend
  - type: web
    name: expiryguard-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: OPEN_MODEL_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: OPEN_MODEL_NAME
        value: google/gemma-4-26b-a4b-it
      # The following must be set manually in the Render Dashboard after deployment
      - key: MONGODB_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: OPEN_MODEL_API_KEY
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: FRONTEND_URL
        sync: false

  # React Vite Frontend (Static Site)
  - type: web
    name: expiryguard-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      # Automatically links the frontend to the deployed backend API URL
      - key: VITE_API_URL
        fromService:
          type: web
          name: expiryguard-backend
          envVarKey: RENDER_EXTERNAL_URL
